<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Action Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-8">
    <div id="app" class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-indigo-400">RAG Action Space Visualizer</h1>
        
        <!-- Prompt Control Panel -->
        <div class="bg-gray-800 p-6 rounded-lg shadow border border-gray-700 space-y-4">
            <label class="block text-sm font-medium">Action Space Prompt (Gemma 2B Max Context)</label>
            <textarea id="promptBox" class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white" rows="3" placeholder="manufacture an electric catamaran...">manufacture an electric catamaran</textarea>
            <button onclick="runAnalysisStream()" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2 rounded shadow">Generate Graph & Run Live Analysis</button>
        </div>

        <!-- Live Status / Progress Stream Box -->
        <div id="progressBox" class="hidden bg-gray-950 p-4 rounded-lg border border-indigo-500/50 space-y-2">
            <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Live Progress</h3>
            <div id="statusStream" class="font-mono text-xs text-green-400 space-y-1"></div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg shadow border border-gray-700 space-y-4">
            <h2 class="text-lg font-semibold text-cyan-400">Action Space Graph Topology</h2>
            <div class="relative w-full h-96 bg-gray-950 rounded-lg border border-gray-700 overflow-hidden flex items-center justify-center">
                <svg id="graphSvg" class="w-full h-full" viewBox="0 0 800 400">
                    <text x="50%" y="50%" fill="#6b7280" dominant-baseline="middle" text-anchor="middle">Enter prompt above and click generate to create a graph...</text>
                </svg>
            </div>
        </div>

        <div id="results" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800 p-6 rounded-lg shadow border border-gray-700 space-y-4">
                <h3 class="text-xs font-bold text-cyan-400 uppercase">logic.pl Knowledge Base Facts:</h3>
                <pre id="llmOut" class="bg-gray-900 p-3 rounded text-xs text-green-300 whitespace-pre-wrap overflow-x-auto h-64"></pre>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg shadow border border-gray-700 space-y-4">
                <h3 class="text-xs font-bold text-indigo-400 uppercase">RAG Stochastic Explanation:</h3>
                <pre id="explanationOut" class="bg-gray-900 p-3 rounded text-xs text-indigo-200 whitespace-pre-wrap overflow-x-auto h-64"></pre>
            </div>
        </div>
    </div>

    <script>
        async function runAnalysisStream() {
            const prompt = document.getElementById('promptBox').value;
            const btn = document.getElementById('submitBtn');
            const progressBox = document.getElementById('progressBox');
            const statusStream = document.getElementById('statusStream');
            
            btn.innerText = 'Running Analysis Pipeline...';
            btn.disabled = true;
            progressBox.classList.remove('hidden');
            statusStream.innerHTML = '';

            try {
                const response = await fetch('/api/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) throw new Error('Stream initialization failed');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep incomplete line

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.substring(6));
                            if (data.status) {
                                const div = document.createElement('div');
                                div.textContent = `> ${data.status}`;
                                statusStream.appendChild(div);
                                statusStream.scrollTop = statusStream.scrollHeight;
                            }
                            if (data.complete) {
                                document.getElementById('llmOut').innerText = data.llmResponse;
                                document.getElementById('explanationOut').innerText = data.explanation;
                                document.getElementById('results').classList.remove('hidden');
                                renderGraph(data.edges, data.paths);
                            }
                        }
                    }
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.innerText = 'Generate Graph & Run Live Analysis';
                btn.disabled = false;
            }
        }

        function renderGraph(edges, paths) {
            const svg = document.getElementById('graphSvg');
            svg.innerHTML = '';

            const nodeSet = new Set();
            edges.forEach(e => { nodeSet.add(e.from); nodeSet.add(e.to); });
            const nodes = Array.from(nodeSet);

            const nodeCoords = {};
            const cx = 400, cy = 200, radius = 150;
            nodes.forEach((node, idx) => {
                const angle = (idx / nodes.length) * 2 * Math.PI;
                nodeCoords[node] = {
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle)
                };
            });

            edges.forEach(e => {
                const p1 = nodeCoords[e.from] || {x: 100, y: 100};
                const p2 = nodeCoords[e.to] || {x: 300, y: 300};

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', p1.x);
                line.setAttribute('y1', p1.y);
                line.setAttribute('x2', p2.x);
                line.setAttribute('y2', p2.y);
                line.setAttribute('stroke', '#4b5563');
                line.setAttribute('stroke-width', '2');
                svg.appendChild(line);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', (p1.x + p2.x) / 2);
                text.setAttribute('y', (p1.y + p2.y) / 2 - 6);
                text.setAttribute('fill', '#9ca3af');
                text.setAttribute('font-size', '9');
                text.setAttribute('text-anchor', 'middle');
                text.textContent = `C:${e.capacity}, L:${e.loss}`;
                svg.appendChild(text);
            });

            nodes.forEach(node => {
                const pt = nodeCoords[node];
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pt.x);
                circle.setAttribute('cy', pt.y);
                circle.setAttribute('r', '26');
                circle.setAttribute('fill', '#4f46e5');
                circle.setAttribute('stroke', '#818cf8');
                circle.setAttribute('stroke-width', '2');
                g.appendChild(circle);

                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('x', pt.x);
                label.setAttribute('y', pt.y + 3);
                label.setAttribute('fill', '#ffffff');
                label.setAttribute('font-size', '10');
                label.setAttribute('font-weight', 'bold');
                label.setAttribute('text-anchor', 'middle');
                label.textContent = node.length > 12 ? node.substring(0, 10) + '..' : node;
                g.appendChild(label);

                svg.appendChild(g);
            });
        }
    </script>
</body>
</html>
